<html lang="es">
    <head>
        <meta charset="UTF-8">

        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="hero">
            <nav class="navbar navbar-expand-md navbar-dark">
                <div class="container-fluid justify-content-center">

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" 
                            aria-controls="navMenu" aria-expanded="false" aria-label="Abrir menú">
                        <div class="navbar-brand">Menú</div>
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navMenu">
                        <ul class="navbar-nav text-center">
                            <li class="nav-item">
                                <a class="nav-link" href="inicio.html">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="productos.html">Productos</a>
                            </li>
                            <li class="nav-item">
                                <span class="nav-link pag-actual">Iniciar sesión</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <div class="hero-content">
                <h1>Iniciar Sesión</h1>
            </div>
        </header>


        <main>
            <section class="cont-form">
                <article id="secc-login" class="secc-form">
                <h2>Iniciar Sesión</h2>
                    <form id="log-form">
                        <div class="grupo-form">
                            <label for="log-email">Correo electrónico:</label>
                            <input type="email" id="log-email" name="email" placeholder="ejemplo@correo.com" autocomplete="email">
                            <span class="error-msg" id="error-log-email"></span>
                        </div>
        
                        <div class="grupo-form">
                            <label for="log-pass">Contraseña:</label>
                            <input type="password" id="log-pass" name="password" placeholder="••••••••" autocomplete="current-password">
                            <span class="error-msg" id="error-log-pass"></span>
                        </div>
        
                        <button type="submit" class="submit-btn">Ingresar</button>
        
                        <p class="texto-registro">
                            ¿Todavía no tienes una cuenta?
                            <a href="#" id="link-registro">Registrarme</a>
                        </p>
        
                        <p class="success-msg" id="login-exito"></p>
                    </form>
                </article>
                <article id="secc-registro" class="secc-form oculto">
                    <h2>Registrarse</h2>
                    <form id="reg-form" novalidate>
                        <div class="grupo-form">
                            <label for="reg-nombre">Nombre Completo:</label>
                            <input type="text" id="reg-nombre" name="nombre" placeholder="Ingrese su nombre aqui" autocomplete="name">
                            <span class="error-msg" id="error-reg-nombre"></span>
                        </div>

                        <div class="grupo-form">
                            <label for="reg-email">Correo electrónico:</label>
                            <input type="email" id="reg-email" name="email" placeholder="ejemplo@correo.com" autocomplete="email">
                            <span class="error-msg" id="error-reg-email"></span>
                        </div>

                        <div class="grupo-form">
                            <label for="reg-pass">Contraseña (mínimo 6 caracteres):</label>
                            <input type="password" id="reg-pass" name="password" placeholder="••••••••" autocomplete="new-password">
                            <span class="error-msg" id="error-reg-pass"></span>
                        </div>

                        <div class="grupo-form">
                            <label for="reg-pass-confirm">Confirmar contraseña:</label>
                            <input type="password" id="reg-pass-confirm" name="password_confirm" placeholder="••••••••" autocomplete="new-password">
                            <span class="error-msg" id="error-reg-pass-confirm"></span>
                        </div>

                        <button type="submit" class="submit-btn">Registrarse</button>

                        <p class="texto-registro">
                            ¿Ya tienes una cuenta?
                            <a href="#" id="link-login">Iniciar Sesión</a>
                        </p>

                        <p class="exito-msg" id="registro-exito"></p>
                        </form>
                </article>

            </section>
        </main>
        
        <footer>
            <div class="container">
                <div class="row text-center text-sm-center">
                    <div id="footer-tienda" class="col-12 col-sm-6 mb-4">
                        <h5>Zapatería Jacinta</h5>
                        <p>La comodidad de caminar, desde 1980.</p>
                    </div>

                    <div class="col-12 col-sm-6 mb-4">
                        <h5>Síguenos</h5>
                        <a href="https://www.instagram.com/jacintashoes.ok/" target="_blank" rel="noopener noreferrer" class="footer-icon" aria-label="Instagram">
                            <i class="bi bi-instagram"></i>
                        </a>
                        <a href="https://www.facebook.com/Jacinta.zapatoss/" target="_blank" rel="noopener noreferrer" class="footer-icon" aria-label="Facebook">
                            <i class="bi bi-facebook"></i>
                        </a>
                    </div>
                </div>

                <hr>

                <p class="text-center mb-0">&copy; <span id="anioActual"></span> Zapatería Jacinta. Todos los derechos reservados.</p>
            </div>
        </footer>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
        <script src="annio.js"></script>
        <script src="login.js"></script>
    </body>
</html>
